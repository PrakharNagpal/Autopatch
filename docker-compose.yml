services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/remediation.db
      - SUPERSET_REPO_PATH=/superset
    volumes:
      - db_data:/data
      - ${SUPERSET_REPO_PATH:-../superset}:/superset:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/remediation.db
      - SUPERSET_REPO_PATH=/superset
    volumes:
      - db_data:/data
      - ${SUPERSET_REPO_PATH:-../superset}:/superset:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
